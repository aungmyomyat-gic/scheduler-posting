services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template
      POSTGRES_DB: team_template
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template -d team_template"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
